name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish (framework-dependent)
        run: dotnet publish TimeClock --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish-fdd

      - name: Publish (self-contained trimmed)
        run: dotnet publish TimeClock --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish-sc

      - name: Create archives
        run: |
          Compress-Archive -Path publish-fdd/* -DestinationPath TimeClock-win-x64-framework-dependent.zip
          Compress-Archive -Path publish-sc/* -DestinationPath TimeClock-win-x64-self-contained.zip

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/*/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: TimeClock ${{ steps.changelog.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            TimeClock-win-x64-framework-dependent.zip
            TimeClock-win-x64-self-contained.zip
          body: |
            ## Downloads
            - **framework-dependent** (~5MB): 需要 [.NET 9 运行时](https://dotnet.microsoft.com/download/dotnet/9.0)
            - **self-contained** (~15-20MB): 无需安装运行时，开箱即用
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
